<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Clone</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">

        <div class="logo">
            <img src="images/insta-logo.png" alt="Instagram Logo">
        </div>

        <div class="menu">
                
            <div class="menu-item">
                <img src="images/home.png" alt="Home">
                <span class="text">Home</span>
            </div>

            <div class="menu-item">
                <img src="images/play.png" alt="Reels">
                <span class="text">Reels</span>
            </div>

            <div class="menu-item">
                <img src="images/message.png" alt="Messages">
                <span class="text">Messages</span>
            </div>

            <div class="menu-item">
                <img src="images/search.png" alt="Search">
                <span class="text">Search</span>
            </div>

            <div class="menu-item">
                <img src="images/explore.png" alt="Explore">
                <span class="text">Explore</span>
            </div>

            <div class="menu-item">
                <img src="images/notification.png" alt="Notification">
                <span class="text">Notification</span>
            </div>

            <div class="menu-item">
                <img src="images/create.png" alt="Create">
                <span class="text">Create</span>
            </div>

            <div class="profile">
                <img src="images/profile.png" alt="Profile">
                <span class="text">Profile</span>
            </div>
        </div>

        <div class="menu">
            
            <div class="menu-item">
                <img src="images/menu.png" alt="Menu">
                 <span class="text">More</span>
            </div>

            <div class="menu-item">
                <img src="images/app.png" alt="Also From Meta">
                <span class="text">Also from Meta</span>
            </div>

        </div>
        
    </div>

    <div class="midbar">

        <div class="story-container">
            <div class="story">
                <img src="images/story1.jpg" alt="Profile">
                <span class="story-text">its_sakshi</span>
            </div>

            <div class="story">
                <img src="images/story2.jpg" alt="Profile">
                <span class="story-text">tech.diary</span>
            </div>

            <div class="story">
                <img src="images/story3.jpg" alt="Profile">
                <span class="story-text">pixel.engineer</span>
            </div>

            <div class="story">
                <img src="images/story4.jpg" alt="Profile">
                <span class="story-text">codecraft.dev</span>
            </div>

            <div class="story">
                <img src="images/story5.jpg" alt="Profile">
                <span class="story-text">coderspace</span>
            </div>

            <div class="story">
                <img src="images/profile.png" alt="Profile">
                <span class="story-text">code.with.ajeet</span>
            </div>
        </div>

        <div class="post-container">

            <div class="post">
                <div class="user-detail">
                    <img src="images/profile.png" alt="User Post">
                    
                    <div class="user-info">
                        <span class="username">code.with.ajeet</span>
                        <span class="post-timing">8 h</span>
                        <span class="post-song">Dharia . Sugar & Brownies</span>
                    </div>

                    <div class="dot-button">
                        <img src="images/more.png" alt="More Options">
                    </div>
                    
                </div>

                <div class="image-video">
                    <img src="images/post1.jpg" alt="User Post">
                </div>

                <div class="post-update">
                    <div class="update-icons">

                        <div class="icon">
                            <img src="images/notification.png" alt="Like">
                            <span class="update-count">1.8k</span>
                        </div>

                        <div class="icon">
                            <img src="images/comment.png" alt="Comment">
                            <span class="update-count">67</span>
                        </div>

                        <div class="icon">
                            <img src="images/repost.png" alt="Repost">
                            <span class="update-count">56</span>
                        </div>

                        <div class="icon">
                            <img src="images/message.png" alt="Share">
                        </div>

                    </div>

                    <div class="description-box">
                        <span class="username">code.with.ajeet</span>
                        <span class="description">welcome to Dubai</span>
                    </div>
                    <span class="more">...more</span>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
