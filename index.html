<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Clone</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">

        <div class="logo">
            <img src="images/insta-logo.png" alt="Instagram Logo">
        </div>

        <div class="menu">
                
            <div class="menu-item">
                <img src="images/home.png" alt="Home">
                <span class="text">Home</span>
            </div>

            <div class="menu-item">
                <img src="images/play.png" alt="Reels">
                <span class="text">Reels</span>
            </div>

            <div class="menu-item">
                <img src="images/message.png" alt="Messages">
                <span class="text">Messages</span>
            </div>

            <div class="menu-item">
                <img src="images/search.png" alt="Search">
                <span class="text">Search</span>
            </div>

            <div class="menu-item">
                <img src="images/explore.png" alt="Explore">
                <span class="text">Explore</span>
            </div>

            <div class="menu-item">
                <img src="images/notification.png" alt="Notification">
                <span class="text">Notification</span>
            </div>

            <div class="menu-item">
                <img src="images/create.png" alt="Create">
                <span class="text">Create</span>
            </div>

            <div class="profile">
                <img src="images/profile.png" alt="Profile">
                <span class="text">Profile</span>
            </div>
        </div>

        <div class="menu">
            
            <div class="menu-item">
                <img src="images/menu.png" alt="Menu">
                 <span class="text">More</span>
            </div>

            <div class="menu-item">
                <img src="images/app.png" alt="Also From Meta">
                <span class="text">Also from Meta</span>
            </div>

        </div>
        
    </div>
    
</body>
</html>
